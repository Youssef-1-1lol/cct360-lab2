<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Focus Room</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="room">
        <h1>Interactive Focus Room</h1>

        <p>
            Use your mouse, keyboard, and the controls below to interact
            with the room.
        </p>

        <button id="theme-button">Change Mood</button>

        <div id="moving-object" class="moving-object">
            Focus
        </div>  
        <p id="status-message">
            The room is waiting for your first action.
        </p>
    </main>
</body>
</html>
